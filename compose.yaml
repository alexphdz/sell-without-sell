services:
  postgres:
    image: postgres:17-alpine
    container_name: kipu-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kipu_dev}
      POSTGRES_USER: ${POSTGRES_USER:-kipu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kipI seeu_dev_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kipu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  kipu_postgres_data:
